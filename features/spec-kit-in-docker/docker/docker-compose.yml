version: '3.8'

services:
  spec-kit:
    build:
      context: .
      dockerfile: Dockerfile
    image: spec-kit:latest
    container_name: spec-kit
    volumes:
      # Mount current directory as workspace
      - .:/workspace
      # Persistent volume for spec-kit tool installs
      - speckit-uv-tools:/root/.local/share/uv/tools
      # Optional: Mount git config for repository operations
      # - ~/.gitconfig:/root/.gitconfig:ro
      # - ~/.ssh:/root/.ssh:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      # Spec-kit version: 'latest' or a git tag/ref (e.g. 'v0.5.0')
      - SPECKIT_VERSION=${SPECKIT_VERSION:-latest}
      # Optional: Set GitHub token for rate limiting
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    command: bash
    
  # Alternative: Run specific specify commands
  spec-kit-init:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
      - speckit-uv-tools:/root/.local/share/uv/tools
    working_dir: /workspace
    environment:
      - SPECKIT_VERSION=${SPECKIT_VERSION:-latest}
    command: ["specify", "init", "--here", "--ai", "copilot"]
    profiles:
      - init

  spec-kit-check:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - speckit-uv-tools:/root/.local/share/uv/tools
    environment:
      - SPECKIT_VERSION=${SPECKIT_VERSION:-latest}
    command: ["specify", "check"]
    profiles:
      - check

volumes:
  speckit-uv-tools:
